# =============================================================================
# EXPERIMENT: local_targets — full-corpus dialogue collection for the two
# school-GPU-hosted target models (Llama-3.1-8B, Mistral-7B-Instruct-v0.3),
# served locally via vLLM on nlp-gpu-01. Dialogue stage only; judge separately.
#
#   python run.py --config configs/experiment/local_targets.yaml --stage dialogue
# =============================================================================

corpus:
  stimuli_file: "data/corpus/stimuli.jsonl"

experiment:
  n_situations: -1   # full frozen corpus (76 situations x 3 personas = 228 conditions)

run:
  name: "local_targets"
  seed: 0
  temperature: 0.5
  n_assistant_turns: 6
  target_max_tokens: 450
  output_dir: "outputs"
  max_concurrency: 4

models:
  user_agent:
    provider: "openai"
    model: "gpt-4o-mini"

  judge:
    provider: "openai"
    model: "gpt-4o"
  validation_judge:
    provider: "deepinfra"
    model: "microsoft/phi-4"
    subset_fraction: 0.10

  targets:
    - {family: "Meta",     scale: "Small", provider: "local", model: "meta-llama/Llama-3.1-8B-Instruct", base_url: "http://127.0.0.1:8001/v1"}
    - {family: "Mistral AI", scale: "Single", provider: "local", model: "mistralai/Mistral-7B-Instruct-v0.3", base_url: "http://127.0.0.1:8002/v1"}

  target_system_prompt: ""

judge:
  labels: ["IF", "OF", "Neutral", "Mixed"]
  if_subcategories:
    - id: "IF_bond_anchoring"
      desc: "placeholder"
    - id: "IF_intimate_dyad"
      desc: "placeholder"
    - id: "IF_inner_life_claims"
      desc: "placeholder"
    - id: "IF_return_hooks"
      desc: "placeholder"

orientation:
  method: "if_minus_of_ratio"
  label_weights:
    IF: 1.0
    OF: -1.0
    Neutral: 0.0
    Mixed: 0.5
